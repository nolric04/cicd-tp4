name: CI - tp4
on:
  push:
    branches:
      - Tavernier
  pull_request:
jobs:
  testing-allure:
    name: Testing & reporting Allure
    runs-on: ubuntu-latest

    steps:
      - name: checkoutRepository
        uses: actions/checkout@v3
      - name: Installation python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Installation packages
        run: pip install -r requirements.txt
      - name: Install Allure commandline
        run: |
         sudo apt update
         sudo apt install -y default-jre
         wget https://github.com/allure-framework/allure2/releases/download/2.26.0/allure-2.26.0.tgz
         tar -xzf allure-2.26.0.tgz
         sudo mv allure-2.26.0 /opt/allure
         sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
        
        

      - name: run test Allure
        run: pytest tests/ -v --alluredir=reports
        continue-on-error: true
      - name: generate report allure
        run: allure generate reports --clean -o allure-report
      - name: Artifact Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
  testing-prometheus:
    name: Testing & reporting Prometheus
    runs-on: ubuntu-latest
    steps:
      - name: checkoutRepository
        uses: actions/checkout@v3
      - name: Installation python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Installation packages
        run: pip install -r requirements.txt